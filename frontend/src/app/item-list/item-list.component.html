<div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1>Items</h1>
    <a routerLink="/items/new" style="background: #007bff; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px;">+ New Item</a>
  </div>
  <div *ngIf="items.length === 0" style="text-align: center; color: #666; margin-top: 40px;">
    No items yet. <a routerLink="/items/new">Create one</a>.
  </div>
  <table *ngIf="items.length > 0" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="background: #f5f5f5;">
        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Name</th>
        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Description</th>
        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Created</th>
        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #ddd;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items" style="border-bottom: 1px solid #eee;">
        <td style="padding: 12px;">{{ item.name }}</td>
        <td style="padding: 12px;">{{ item.description }}</td>
        <td style="padding: 12px;">{{ item.created_at | date:'short' }}</td>
        <td style="padding: 12px;">
          <button (click)="editItem(item.id!)" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 8px;">Edit</button>
          <button (click)="deleteItem(item.id!)" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
